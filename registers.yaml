# =============================================================================
# GreenCoyote-Bay Pilot FPGA - MMIO Register Specification
# Project: ODIN_Bridge / Cascaded Optical Reduction Fabric
# =============================================================================
#
# THIS FILE IS THE SOURCE OF TRUTH.
#
# Do not hand-edit generated register definitions in gcb-rtl, gcb-host, or
# gcb-dashboard. Edit here, then re-run regen.py in each consumer.
#
# Bump map_version on ANY address, width, or field-encoding change. The proxy
# stamps map_version into every snapshot row so historical SQLite data can be
# decoded against the map that produced it.
#
# -----------------------------------------------------------------------------
# TRANSCRIPTION PROVENANCE
# -----------------------------------------------------------------------------
# Transcribed from gcb-rtl/rtl/greencoyote_pilot_regs.sv (rank-1 "v8" import,
# 920 lines, header dated June 2026), by reading the write-decoder case items,
# the read-decoder concatenations, and the reset block -- NOT the header
# comment. Where those three disagree, the discrepancy is recorded in the
# `defects:` block on the affected register.
#
# addr_width is 8. The RTL originally declared 6, which could not address this
# map (every offset above 0x3F truncated and aliased onto a lower-half
# register). Widened to [7:0] in gcb-rtl commit 657b473 -- see DEFECT-001
# (resolved).
# =============================================================================

map_version: "0.6.0"
# 0.6.0 -- STREAMING TENSOR DMA block 0xC4-0xE4: descriptor-ring / autonomous 2D
#          tensor DMA that feeds activation + weight operand tiles to the optical
#          modulator DACs (docs/streaming_dma_architecture.md sec 6.4). Adds
#          DMA_CTRL, DMA_DESC_RING_BASE_LO/HI, DMA_DESC_HEAD, DMA_DESC_TAIL
#          (doorbell), DMA_DESC_WINDOW (auto-increment descriptor write port,
#          BRAM_WR_DATA_HI style), DMA_WEIGHT_TILE_LO/HI (stationary-load
#          trigger), DMA_STATUS. Also adds IRQ_CTRL.IRQ_DMA_DONE_EN[5] /
#          IRQ_DMA_UNDERRUN_EN[6] (was RSVD). Additive block + one existing-reg
#          field-encoding change; address_space.end widened 0xC0 -> 0xE4. RTL is
#          follow-on (no *.sv authored yet) -- this bump lands the map only.
# 0.5.2 -- Add a fifth regen.py consumer: gcb-wiki/datasheet/GCB-DS-PRELIM.md
#          (`--target md`). regen.py injects the §5 Register Map table between
#          the datasheet's REGEN markers instead of overwriting the file.
#          No address / width / field-encoding change vs 0.5.1.
# 0.5.1 -- Finalisation: Single-Slope CIS is the SELECTED GCB receiver
#          (docs/adr/ADR-005). Charge-Balancing Sigma-Delta branch retired.
#          Adds the design_decisions: block (DD-001, 6 GHz carry-select).
#          No address / width / field-encoding change vs 0.5.0 -- provenance
#          bump only; re-run through regen.py --all for the consumers.
# 0.5.0 -- SS_READOUT block 0xB0-0xC0: single-slope TDC gate/counter control,
#          the per-channel 3-point calibration coefficient store (SS_CAL_IDX /
#          SS_CAL_DATA, auto-increment like the BRAM window), ramp/gate timing,
#          and SS_TDC_STATUS. Additive; address_space.end widened 0xAC -> 0xC0.
#          See gcb-papers/data/readout/rtl/RTL_REPORT.md and
#          gcb-rtl/rtl/greencoyote_ss_{tdc,calib}.sv.
# 0.4.0 -- REDUCTION_CTRL.ROUND_MODE[12:11] and new RO BLK_SCALE_STATUS (0xAC)
#          for the pilot block-floating-point NORMALIZE pass
#          (carry_save_streaming_contract.md 5.1-5.4, 8.1). Additive.
# 0.3.0 -- prior baseline.

module: greencoyote_pilot_regs

address_space:
  base: 0x00
  end: 0xE4              # 0xC0 -> 0xE4 in map_version 0.6.0 (Streaming Tensor DMA block)
  stride: 4
  addr_width: 8          # widened in gcb-rtl 657b473 -- see DEFECT-001 (resolved)
  unmapped_read: 0xDEADBEEF

# Access types used throughout:
#   rw        read/write storage register
#   rw_locked read/write, but writes gated by another field (see write_gate)
#   ro        read-only; reflects a module input signal, no storage
#   w1p       write-1-pulse; sets a one-cycle strobe, always reads back 0
#   wo        write-only; no readback path at all
#   rsvd      reserved; reads 0

defects:
  DEFECT-001:
    severity: blocker
    status: resolved
    fixed_in: gcb-rtl 657b473
    summary: >
      mmio_addr was declared [5:0]. Every case item above 0x3F truncated to its
      low 6 bits and collided with a lower-half register. Verilog case takes
      the first match, and the lower-half items are listed first, so all
      upper-half decoding was dead except write 0x68 (landed on free slot 0x28)
      and read 0x7C (landed on free slot 0x3C). Because the alias hit a real
      case item, the 0xDEADBEEF sentinel never fired and the host silently
      received a different register's contents.
    fix: >
      Widened mmio_addr to [7:0] in greencoyote_pilot_regs, greencoyote_axi_lite_wrapper
      and greencoyote_top, and rebased every 6'hXX case label to 8'hXX.
  DEFECT-002:
    severity: blocker
    summary: >
      All outputs are declared `output reg` and then driven by continuous
      `assign`. Illegal - a variable cannot be continuously assigned. Applies
      to the unpacked arrays trim_ch, xbar_port_dest, lc_init as well.
      mmio_rdata is the one legitimate `output reg` (driven procedurally).
    fix: change every continuously-assigned output to `output wire`
  DEFECT-003:
    severity: major
    summary: >
      Thermal block 0x40-0x5C is documented in the header comment but has no
      case items and no module ports. Eight registers that do not exist.
    fix: implement, or delete from the header map
  DEFECT-004:
    severity: major
    summary: >
      Several read-decoder concatenations do not total 32 bits. Most
      zero-extend or truncate harmlessly, but TASK_ALLOC_CTRL (0x90) is 31
      bits, which shifts TID_ACTIVE_MASK down to [30:15] instead of [31:16],
      and TILE_ALLOC_MAP (0x98) is 36 bits, which places its fields nowhere
      near the documented positions.
    fix: see per-register defects on 0x90 and 0x98

# DEFECT-001..004 are register-map / RTL-hygiene defects. They are NOT
# associated with the retired Charge-Balancing Sigma-Delta readout branch
# (ADR-005) -- that branch never reached a spec artifact; nothing to retire in
# this file. They remain tracked as-is.

design_decisions:
  # Decisions, not defects. Recorded here so a future "simplification" does not
  # silently undo them.
  DD-001:
    title: 6 GHz single-slope Gray counter uses carry-select, not ripple carry
    status: accepted
    context: >
      SS_TDC (greencoyote_ss_tdc.sv) runs a 12-bit binary counter at 6 GHz
      (166.7 ps period) whose Gray view is distributed to 64 channel capture
      latches. ASAP7 7.5T static CMOS, SS/125 C derate ~1.5x.
    finding: >
      A 12-bit RIPPLE-carry counter does NOT close at SS/125 C: 12-stage carry
      ~145 ps + CK->Q ~23 ps + next-state XOR/setup ~27 ps ~= 195 ps > 166.7 ps
      (fails by ~28 ps). At TT/0.7 V it closes with only ~37 ps slack, which
      hides the slow-corner failure in a nominal-only timing run.
    decision: >
      The counter MUST be carry-select or carry-lookahead (or a 4x3-bit
      segmented counter with a pipelined segment carry). Carry-select 12-bit
      ~= 62 ps at SS/125 C -> ~112 ps path, ~55 ps slack. The bin->Gray XOR is
      off the counter's critical loop (feeds only the distribution flops) and
      is not a 6 GHz bottleneck.
      Additionally: the 4-phase 6 GHz CLOCK generation + distribution is a CML
      island (DLL/ILO, CML trunk, CML->CMOS at each phase-latch bank); the
      counter, phase latches, capture and calibration logic stay static CMOS.
    do_not: >
      Do not "simplify" the counter back to ripple carry on the basis of a
      TT-only timing report. Do not build the 6 GHz 4-phase clock in static
      CMOS.
    refs:
      - gcb-rtl/rtl/greencoyote_ss_tdc.sv
      - gcb-papers/data/readout/rtl/RTL_REPORT.md (sec 3)
      - docs/adr/ADR-005-Single-Slope-Readout.md

registers:

  # ===========================================================================
  # INFERENCE DOMAIN  0x00 - 0x14
  # ===========================================================================

  - name: PRECISION_MODE
    offset: 0x00
    domain: inference
    description: DAC/ADC precision mode and analog headroom configuration.
    fields:
      - { name: MODE_SEL,       bits: [2, 0],  access: rw, reset: 0b010, signal: r_mode_sel,       output: mode_sel,
          enum: { 0: INT4, 1: FP4, 2: FP8, 3: BF16 },
          description: "Reset default FP8 - tightest constraint." }
      - { name: NOISE_HEADROOM, bits: [4, 3],  access: rw, reset: 0b01,  signal: r_noise_headroom, output: noise_headroom,
          description: "Bits reserved against the analog noise floor." }
      - { name: SAT_GUARD,      bits: [6, 5],  access: rw, reset: 0b01,  signal: r_sat_guard,      output: sat_guard,
          description: "Saturation guard band." }
      - { name: RSVD,           bits: [31, 7], access: rsvd }

  - name: GLOBAL_CAL
    offset: 0x04
    domain: inference
    description: Global ADC dark-offset and gain calibration.
    write_gate:
      field: CAL_LOCK
      note: >
        When CAL_LOCK is set, writes to the other three fields are dropped,
        UNLESS the same write also clears CAL_LOCK[25] -- that transaction lands
        its payload and releases the lock atomically (gcb-rtl 657b473:
        `if (!r_cal_lock || !mmio_wdata[25])`). CAL_LOCK itself is always writable.
    fields:
      - { name: DARK_OFFSET,      bits: [11, 0],  access: rw_locked, reset: 0x000, signal: r_dark_offset,      output: dark_offset }
      - { name: GAIN_TRIM_GLOBAL, bits: [23, 12], access: rw_locked, reset: 0x000, signal: r_gain_trim_global, output: gain_trim_global }
      - { name: CAL_VALID,        bits: [24, 24], access: rw_locked, reset: 0,     signal: r_cal_valid,        output: cal_valid }
      - { name: CAL_LOCK,         bits: [25, 25], access: rw,        reset: 0,     signal: r_cal_lock,         output: cal_lock,
          description: "Always writable, including to clear itself." }
      - { name: RSVD,             bits: [31, 26], access: rsvd }

  - name: CH_GAIN_TRIM_LO
    offset: 0x08
    domain: inference
    description: Per-channel gain trim, channels 0-3.
    fields:
      - { name: TRIM_CH0, bits: [7, 0],   access: rw, reset: 0xFF, signal: r_trim_ch0, output: "trim_ch[0]", description: "0xFF = unity gain." }
      - { name: TRIM_CH1, bits: [15, 8],  access: rw, reset: 0xFF, signal: r_trim_ch1, output: "trim_ch[1]" }
      - { name: TRIM_CH2, bits: [23, 16], access: rw, reset: 0xFF, signal: r_trim_ch2, output: "trim_ch[2]" }
      - { name: TRIM_CH3, bits: [31, 24], access: rw, reset: 0xFF, signal: r_trim_ch3, output: "trim_ch[3]" }

  - name: CH_GAIN_TRIM_HI
    offset: 0x0C
    domain: inference
    description: Per-channel gain trim, channels 4-7.
    fields:
      - { name: TRIM_CH4, bits: [7, 0],   access: rw, reset: 0xFF, signal: r_trim_ch4, output: "trim_ch[4]" }
      - { name: TRIM_CH5, bits: [15, 8],  access: rw, reset: 0xFF, signal: r_trim_ch5, output: "trim_ch[5]" }
      - { name: TRIM_CH6, bits: [23, 16], access: rw, reset: 0xFF, signal: r_trim_ch6, output: "trim_ch[6]" }
      - { name: TRIM_CH7, bits: [31, 24], access: rw, reset: 0xFF, signal: r_trim_ch7, output: "trim_ch[7]" }

  - name: REDUCTION_CTRL
    offset: 0x10
    domain: inference
    description: Reduction fire control and sequencer status.
    fields:
      - { name: FIRE,        bits: [0, 0],   access: w1p, signal: r_fire_pulse, output: fire,
          description: "Self-clearing one-cycle strobe. Always reads 0." }
      - { name: MODE_ACTIVE, bits: [1, 1],   access: ro, source: mode_active }
      - { name: PASS_INDEX,  bits: [3, 2],   access: ro, source: pass_index,
          description: "Cascade pass index. 14-GPU workload uses two passes." }
      - { name: QUEUE_DEPTH, bits: [7, 4],   access: ro, source: queue_depth }
      - { name: CAL_ERR,     bits: [8, 8],   access: ro, source: cal_err }
      - { name: FIRE_DONE,   bits: [9, 9],   access: ro, source: fire_done }
      - { name: AUTO_FIRE,   bits: [10, 10], access: rw, reset: 0, signal: r_auto_fire, output: auto_fire,
          description: "When set, an internal FIRE strobe is generated on the RISING EDGE of queue_full while !mode_active (edge-detected via queue_full_prev, gcb-rtl 657b473). A still-full buffer does not re-arm a new reduction each cycle. The sequencer consumes only the fire pulse; it no longer level-triggers on auto_fire && queue_full." }
      - { name: ROUND_MODE,  bits: [12, 11], access: rw, reset: 0b01, signal: r_round_mode, output: round_mode,
          enum: { 0: TRUNC, 1: RNE, 2: STOCHASTIC, 3: RSVD },
          description: "Rounding applied inside the pilot NORMALIZE block-floating-point pass (carry_save_streaming_contract.md 5.2). 00 truncate (lowest cost, short cascades); 01 round-nearest-even (reset default, inference); 10 stochastic (training-adjacent / deep cascades, per-lane LFSR dither); 11 reserved. Consumed by greencoyote_photonic_sequencer.sv per the 8.2 rewrite." }
      - { name: RSVD,        bits: [31, 13], access: rsvd }

  - name: IRQ_CTRL
    offset: 0x14
    domain: inference
    description: Interrupt enables, status, and clear.
    fields:
      - { name: IRQ_EN,             bits: [0, 0], access: rw, reset: 0, signal: r_irq_en,
          description: "Master enable. irq_out = IRQ_STATUS && IRQ_EN." }
      - { name: IRQ_FIRE_DONE_EN,   bits: [1, 1], access: rw, reset: 0, signal: r_irq_fire_done_en }
      - { name: IRQ_CAL_ERR_EN,     bits: [2, 2], access: rw, reset: 0, signal: r_irq_cal_err_en }
      - { name: IRQ_QUEUE_FULL_EN,  bits: [3, 3], access: rw, reset: 0, signal: r_irq_queue_full_en }
      - { name: IRQ_PASS_DONE_EN,   bits: [4, 4], access: rw, reset: 0, signal: r_irq_pass_done_en }
      - { name: IRQ_DMA_DONE_EN,    bits: [5, 5], access: rw, reset: 0, signal: r_irq_dma_done_en,
          description: "Enable IRQ on Streaming Tensor DMA descriptor-list completion (docs/streaming_dma_architecture.md 6.4). Added in map_version 0.6.0." }
      - { name: IRQ_DMA_UNDERRUN_EN, bits: [6, 6], access: rw, reset: 0, signal: r_irq_dma_underrun_en,
          description: "Enable IRQ on DMA_STATUS.UNDERRUN (a line buffer would have underrun at a fire boundary; the window is aborted). Added in map_version 0.6.0." }
      - { name: RSVD_7,             bits: [7, 7], access: rsvd }
      - { name: IRQ_STATUS,         bits: [8, 8], access: ro, source: r_irq_status,
          description: "Sticky. Cleared by writing IRQ_CLEAR." }
      - { name: IRQ_CLEAR,          bits: [9, 9], access: wo,
          description: "Write 1 to clear IRQ_STATUS. No readback." }
      - { name: RSVD,               bits: [31, 10], access: rsvd }
    defects:
      - "Read concat totals 31 bits (22'h0 pad should be 23'h0). Zero-extends benignly; field positions are correct."

  # ===========================================================================
  # ROUTING DOMAIN  0x18 - 0x20
  # ===========================================================================

  - name: XBAR_ROUTE_LO
    offset: 0x18
    domain: routing
    description: Crossbar destination for input ports 0-3.
    write_side_effect: "Pulses xbar_update for one cycle to strobe the optical switch."
    field_enum: &xbar_dest_enum
      0: GPU0
      1: GPU1
      2: GPU2
      3: GPU3
      4: GPU4
      5: PIPELINE_NEXT
      6: REDUCE_STAGE
      7: BROADCAST
    fields:
      - { name: XBAR_DEST0, bits: [2, 0],   access: rw, reset: 0b111, signal: r_xbar_dest0, output: "xbar_port_dest[0]", enum: *xbar_dest_enum }
      - { name: XBAR_DEST1, bits: [5, 3],   access: rw, reset: 0b111, signal: r_xbar_dest1, output: "xbar_port_dest[1]", enum: *xbar_dest_enum }
      - { name: XBAR_DEST2, bits: [8, 6],   access: rw, reset: 0b111, signal: r_xbar_dest2, output: "xbar_port_dest[2]", enum: *xbar_dest_enum }
      - { name: XBAR_DEST3, bits: [11, 9],  access: rw, reset: 0b111, signal: r_xbar_dest3, output: "xbar_port_dest[3]", enum: *xbar_dest_enum }
      - { name: RSVD,       bits: [31, 12], access: rsvd }

  - name: XBAR_ROUTE_HI
    offset: 0x1C
    domain: routing
    description: Crossbar destination for input ports 4-7.
    write_side_effect: "Pulses xbar_update for one cycle."
    fields:
      - { name: XBAR_DEST4, bits: [2, 0],   access: rw, reset: 0b111, signal: r_xbar_dest4, output: "xbar_port_dest[4]", enum: *xbar_dest_enum }
      - { name: XBAR_DEST5, bits: [5, 3],   access: rw, reset: 0b111, signal: r_xbar_dest5, output: "xbar_port_dest[5]", enum: *xbar_dest_enum }
      - { name: XBAR_DEST6, bits: [8, 6],   access: rw, reset: 0b111, signal: r_xbar_dest6, output: "xbar_port_dest[6]", enum: *xbar_dest_enum }
      - { name: XBAR_DEST7, bits: [11, 9],  access: rw, reset: 0b111, signal: r_xbar_dest7, output: "xbar_port_dest[7]", enum: *xbar_dest_enum }
      - { name: RSVD,       bits: [31, 12], access: rsvd }

  - name: XBAR_MODE_STATUS
    offset: 0x20
    domain: routing
    description: Crossbar parallelism mode and switch-ready status.
    write_side_effect: "Pulses xbar_update for one cycle."
    fields:
      - { name: XBAR_MODE,  bits: [1, 0],  access: rw, reset: 0b00, signal: r_xbar_mode, output: xbar_mode,
          enum: { 0: TENSOR, 1: PIPELINE, 2: MOE, 3: CUSTOM } }
      - { name: XBAR_READY, bits: [2, 2],  access: ro, source: xbar_ready }
      - { name: RSVD,       bits: [31, 3], access: rsvd }

  # ===========================================================================
  # TRAINING DOMAIN  0x24 - 0x38
  # ===========================================================================

  - name: TRAIN_CTRL
    offset: 0x24
    domain: training
    description: LoRA sidecar training mode control.
    fields:
      - { name: TRAIN_MODE,     bits: [0, 0],   access: rw, reset: 0, signal: r_train_mode,     output: train_mode,
          enum: { 0: INFERENCE, 1: LORA_ADAPT } }
      - { name: DAC_FREEZE,     bits: [1, 1],   access: rw, reset: 1, signal: r_dac_freeze,     output: dac_freeze,
          description: "Reset default 1 - freeze sidecar DACs is the safe state." }
      - { name: UPDATE_PENDING, bits: [2, 2],   access: ro, source: update_pending }
      - { name: UPDATE_ACTIVE,  bits: [3, 3],   access: ro, source: update_active }
      - { name: SIDECAR_ENABLE, bits: [4, 4],   access: rw, reset: 0, signal: r_sidecar_enable, output: sidecar_enable }
      - { name: LORA_RANK,      bits: [7, 5],   access: rw, reset: 0b001, signal: r_lora_rank,  output: lora_rank,
          description: "Encoded rank. Reset default 001 = rank 8." }
      - { name: ALPHA_SCALED,   bits: [23, 8],  access: rw, reset: 0x0100, signal: r_alpha_scaled, output: alpha_scaled,
          format: Q8.8, description: "alpha/r. Reset default 0x0100 = 1.0." }
      - { name: RSVD,           bits: [31, 24], access: rsvd }
    defects:
      - "SIDECAR_ENABLE is stored and driven out, but the read decoder returns a hardwired 1'b0 at bit 4. Write-only in practice."

  - name: GRAD_UPDATE_STATUS
    offset: 0x28
    domain: training
    access: ro
    description: Gradient update progress from the Learning Appliance.
    fields:
      - { name: CHANNELS_UPDATED, bits: [15, 0],  access: ro, source: channels_updated }
      - { name: UPDATE_DONE,      bits: [16, 16], access: ro, source: update_done }
      - { name: CHECKSUM_PASS,    bits: [17, 17], access: ro, source: checksum_pass }
      - { name: CHECKSUM_FAIL,    bits: [18, 18], access: ro, source: checksum_fail }
      - { name: RSVD,             bits: [31, 19], access: rsvd }

  - name: LORA_TILE_ADDR
    offset: 0x2C
    domain: training
    description: Sidecar DAC tile coordinates.
    fields:
      - { name: LORA_TILE_ROW, bits: [15, 0],  access: rw, reset: 0x0000, signal: r_lora_tile_row, output: lora_tile_row }
      - { name: LORA_TILE_COL, bits: [31, 16], access: rw, reset: 0x0000, signal: r_lora_tile_col, output: lora_tile_col }

  - name: CELL_COUNT_SYNC
    offset: 0x30
    domain: training
    description: Training Cell census and readiness.
    fields:
      - { name: CELL_COUNT,       bits: [9, 0],   access: rw, reset: 0x008, signal: r_cell_count, output: cell_count,
          description: "Host writes total cell count at init. Reset default 8." }
      - { name: CELLS_READY,      bits: [19, 10], access: ro, source: cells_ready }
      - { name: ALL_CELLS_READY,  bits: [20, 20], access: ro, source: null,
          description: "Documented but hardwired to 1'b0 in the read decoder. Not computed." }
      - { name: GRAD_REDUCE_DONE, bits: [21, 21], access: ro, source: grad_reduce_done }
      - { name: RSVD,             bits: [31, 22], access: rsvd }
    defects:
      - "Read concat totals 33 bits (11'h0 pad should be 10'h0). MSB truncates off the pad; field positions are correct."
      - "ALL_CELLS_READY is a hardwired zero, not a real status bit."

  - name: GRAD_REDUCE_CTRL
    offset: 0x34
    domain: training
    description: Optical gradient all-reduce control.
    fields:
      - { name: GRAD_REDUCE_EN,   bits: [0, 0],  access: rw,  reset: 0, signal: r_grad_reduce_en,   output: grad_reduce_en }
      - { name: GRAD_REDUCE_FIRE, bits: [1, 1],  access: w1p, signal: r_grad_reduce_fire, output: grad_reduce_fire,
          description: "Self-clearing. Always reads 0." }
      - { name: AUTO_GRAD_REDUCE, bits: [2, 2],  access: rw,  reset: 0, signal: r_auto_grad_reduce, output: auto_grad_reduce,
          description: "Fires when cells_ready >= CELL_COUNT && !grad_reduce_done." }
      - { name: RSVD_7_3,         bits: [7, 3],  access: rsvd }
      - { name: GRAD_SCALE,       bits: [31, 8], access: rw, reset: 0x010000, signal: r_grad_scale, output: grad_scale,
          format: Q8.16, description: "Reset default 0x010000 = 1.0." }

  - name: SPI_CFG
    offset: 0x38
    domain: training
    description: Sidecar SPI bus configuration.
    fields:
      - { name: N_SPI_BUSES, bits: [1, 0],   access: rw, reset: 0b00,   signal: r_n_spi_buses, output: n_spi_buses,
          description: "Parallel SPI buses per cell. Reset default 0 = 1 bus." }
      - { name: RSVD_7_2,    bits: [7, 2],   access: rsvd }
      - { name: SPI_CLK_DIV, bits: [23, 8],  access: rw, reset: 0x0004, signal: r_spi_clk_div, output: spi_clk_div }
      - { name: RSVD,        bits: [31, 24], access: rsvd }

  # ===========================================================================
  # THERMAL DOMAIN  0x40 - 0x5C   -- NOT IMPLEMENTED (DEFECT-003)
  # ===========================================================================
  # These eight offsets appear in the RTL header comment but have no case items
  # and no module ports. They are recorded here as unimplemented so the
  # generator emits no constants for them and so the gap is visible rather than
  # silently absent. Populate `fields:` when the thermal block is built.

  - { name: THERMAL_TARGET,     offset: 0x40, domain: thermal, implemented: false, description: "TEC setpoint." }
  - { name: THERMISTOR_TELEM0,  offset: 0x44, domain: thermal, implemented: false }
  - { name: THERMISTOR_TELEM1,  offset: 0x48, domain: thermal, implemented: false }
  - { name: TEC_CTRL_STATUS,    offset: 0x4C, domain: thermal, implemented: false }
  - { name: THERMAL_GUARD_RAIL, offset: 0x50, domain: thermal, implemented: false, description: "Three-tier guard rail status." }
  - { name: THERMAL_LOG,        offset: 0x54, domain: thermal, implemented: false }
  - { name: THERMAL_IRQ_CTRL,   offset: 0x58, domain: thermal, implemented: false }
  - { name: TEC_PID_COEFF,      offset: 0x5C, domain: thermal, implemented: false }

  # ===========================================================================
  # ISA EXECUTION DOMAIN  0x60 - 0x7C
  # ===========================================================================

  - name: EXEC_CTRL
    offset: 0x60
    domain: isa
    description: Primitive ISA interpreter control and status.
    fields:
      - { name: EXEC_START,   bits: [0, 0],   access: rw, reset: 0, signal: r_exec_start, output: exec_start }
      - { name: EXEC_STOP,    bits: [1, 1],   access: rw, reset: 0, signal: r_exec_stop,  output: exec_stop }
      - { name: EXEC_RESET,   bits: [2, 2],   access: rw, reset: 0, signal: r_exec_reset, output: exec_reset }
      - { name: EXEC_STEP,    bits: [3, 3],   access: rw, reset: 0, signal: r_exec_step,  output: exec_step }
      - { name: RSVD_7_4,     bits: [7, 4],   access: rsvd }
      - { name: EXEC_RUNNING, bits: [8, 8],   access: ro, source: exec_running }
      - { name: EXEC_DONE,    bits: [9, 9],   access: ro, source: exec_done }
      - { name: EXEC_ERROR,   bits: [10, 10], access: ro, source: exec_error }
      - { name: RSVD_11,      bits: [11, 11], access: rsvd }
      - { name: EXEC_PC,      bits: [23, 12], access: ro, source: exec_pc }
      - { name: EXEC_OPCODE,  bits: [31, 24], access: ro, source: exec_opcode }
    defects:
      - "EXEC_START/STOP/RESET/STEP are level registers that latch and never self-clear. They are almost certainly intended as w1p strobes - as written, EXEC_START stays asserted forever after one write."

  - name: BRAM_WR_ADDR
    offset: 0x64
    domain: isa
    description: BRAM program-store write address.
    write_side_effect: "Clears bram_wr_en. Auto-increments on a BRAM_WR_DATA_HI write."
    fields:
      - { name: BRAM_WR_ADDR, bits: [11, 0],  access: rw, reset: 0x000, signal: r_bram_wr_addr, output: bram_wr_addr }
      - { name: RSVD,         bits: [31, 12], access: rsvd }

  - name: BRAM_WR_DATA_LO
    offset: 0x68
    domain: isa
    description: Low 32 bits of the 64-bit instruction word.
    write_side_effect: "Clears bram_wr_en."
    fields:
      - { name: BRAM_WR_DATA_LO, bits: [31, 0], access: rw, reset: 0x00000000, signal: r_bram_wr_data_lo, output: bram_wr_data_lo }

  - name: BRAM_WR_DATA_HI
    offset: 0x6C
    domain: isa
    description: High 32 bits. Writing this commits the assembled instruction.
    write_side_effect: "Asserts bram_wr_en and increments BRAM_WR_ADDR."
    fields:
      - { name: BRAM_WR_DATA_HI, bits: [31, 0], access: rw, reset: 0x00000000, signal: r_bram_wr_data_hi, output: bram_wr_data_hi }
    defects:
      - "bram_wr_en is set here but has no auto-clear (unlike r_fire_pulse). It is only cleared by a subsequent 0x64 or 0x68 write, so it stays asserted across the gap."

  - name: LC_LOAD_LO
    offset: 0x70
    domain: isa
    description: Loop counter initial values, LC0 and LC1.
    fields:
      - { name: LC0, bits: [15, 0],  access: rw, reset: 0x0000, signal: "r_lc_init[0]", output: "lc_init[0]" }
      - { name: LC1, bits: [31, 16], access: rw, reset: 0x0000, signal: "r_lc_init[1]", output: "lc_init[1]" }

  - name: LC_LOAD_HI
    offset: 0x74
    domain: isa
    description: Loop counter initial values, LC2 and LC3.
    fields:
      - { name: LC2, bits: [15, 0],  access: rw, reset: 0x0000, signal: "r_lc_init[2]", output: "lc_init[2]" }
      - { name: LC3, bits: [31, 16], access: rw, reset: 0x0000, signal: "r_lc_init[3]", output: "lc_init[3]" }

  - name: SYNC_STATUS
    offset: 0x78
    domain: isa
    access: ro
    description: Fabric SYNC barrier status.
    fields:
      - { name: SYNC_PENDING, bits: [15, 0],  access: ro, source: sync_pending, description: "SYNC_ID being awaited." }
      - { name: RSVD_16,      bits: [16, 16], access: rsvd }
      - { name: SYNC_TIMEOUT, bits: [17, 17], access: ro, source: sync_timeout }
      - { name: RSVD,         bits: [31, 18], access: rsvd }

  - name: EXEC_ERR_LOG
    offset: 0x7C
    domain: isa
    access: ro
    description: Interpreter error capture.
    fields:
      - { name: ERR_PC,     bits: [11, 0],  access: ro, source: err_pc }
      - { name: ERR_OPCODE, bits: [19, 12], access: ro, source: err_opcode }
      - { name: ERR_CAUSE,  bits: [23, 20], access: ro, source: err_cause }
      - { name: RSVD,       bits: [31, 24], access: rsvd }
    defects:
      - "RTL comment claims ERR_CAUSE is at [27:24]. The actual concatenation places it at [23:20]. Spec follows the concatenation."

  # ===========================================================================
  # SNAPSHOT DOMAIN  0x80 - 0x8C
  # ===========================================================================

  - name: SNAPSHOT_STATUS
    offset: 0x80
    domain: snapshot
    access: ro
    description: Snapshot and rollback state machine status.
    fields:
      - { name: SNAPSHOT_READY,    bits: [0, 0],   access: ro, source: snapshot_ready }
      - { name: SNAPSHOT_RUNNING,  bits: [1, 1],   access: ro, source: snapshot_running }
      - { name: SNAP_DIVERGE,      bits: [2, 2],   access: ro, source: snap_diverge, description: "CRC-32 mismatch vs previous snapshot." }
      - { name: ROLLBACK_ACTIVE,   bits: [3, 3],   access: ro, source: rollback_active }
      - { name: ROLLBACK_COMPLETE, bits: [4, 4],   access: ro, source: rollback_complete }
      - { name: SYSTEMIC_FAULT,    bits: [5, 5],   access: ro, source: systemic_fault, description: "ROLLBACK_LIMIT exceeded." }
      - { name: RESTORE_OK,        bits: [6, 6],   access: ro, source: restore_ok }
      - { name: RESTORE_FAIL,      bits: [7, 7],   access: ro, source: restore_fail }
      - { name: SNAP_ID_LAST,      bits: [15, 8],  access: ro, source: snap_id_last }
      - { name: SNAP_PC_LAST,      bits: [27, 16], access: ro, source: snap_pc_last }
      - { name: RSVD,              bits: [31, 28], access: rsvd }

  - name: ROLLBACK_CTRL
    offset: 0x84
    domain: snapshot
    description: Automatic rollback policy.
    fields:
      - { name: ROLLBACK_COUNT,  bits: [7, 0],   access: ro, source: null,
          description: "Documented as rollback_count from the interpreter, but hardwired 8'h0 in the read decoder." }
      - { name: ROLLBACK_LIMIT,  bits: [15, 8],  access: rw, reset: 0x03, signal: r_rollback_limit, output: rollback_limit }
      - { name: SNAP_PC_LAST,    bits: [27, 16], access: ro, source: snap_pc_last, description: "Mirror of SNAPSHOT_STATUS.SNAP_PC_LAST." }
      - { name: FAULT_IRQ_EN,    bits: [28, 28], access: rw, reset: 1, signal: r_fault_irq_en, output: fault_irq_en }
      - { name: ROLLBACK_EN,     bits: [29, 29], access: rw, reset: 1, signal: r_rollback_en,  output: rollback_en }
      - { name: RSVD,            bits: [31, 30], access: rsvd }

  - name: FAULT_LOG
    offset: 0x88
    domain: snapshot
    access: ro
    description: Last fault capture.
    fields:
      - { name: FAULT_CAUSE,  bits: [3, 0],   access: ro, source: fault_cause }
      - { name: FAULT_TILE,   bits: [11, 4],  access: ro, source: fault_tile }
      - { name: FAULT_PC,     bits: [23, 12], access: ro, source: fault_pc }
      - { name: FAULT_COUNT,  bits: [27, 24], access: ro, source: fault_count }
      - { name: FAULT_IRQ_EN, bits: [28, 28], access: ro, source: r_fault_irq_en, description: "Mirror of ROLLBACK_CTRL.FAULT_IRQ_EN." }
      - { name: RSVD,         bits: [31, 29], access: rsvd }

  - name: SNAP_LOG_PTR
    offset: 0x8C
    domain: snapshot
    access: ro
    description: BRAM location of the most recent snapshot.
    fields:
      - { name: SNAP_LOG_BASE, bits: [11, 0],  access: ro, source: snap_log_base }
      - { name: SNAP_LOG_SIZE, bits: [23, 12], access: ro, source: snap_log_size }
      - { name: SNAP_COUNT,    bits: [31, 24], access: ro, source: snap_count }
    defects:
      - "Read concat totals 40 bits. The leading 8'h0 pad truncates away entirely, which happens to leave the three fields correctly placed. Fix the pad anyway - it currently works by accident."

  # ===========================================================================
  # OS / MULTI-TASK DOMAIN  0x90 - 0xA8
  # ===========================================================================

  - name: TASK_ALLOC_CTRL
    offset: 0x90
    domain: os
    description: TID selection and task allocation status.
    fields:
      - { name: ACTIVE_TID,      bits: [3, 0],   access: rw, reset: 0x0, signal: r_active_tid, output: active_tid,
          description: "Selects which TID the 0x94/0xA0 status reads refer to." }
      - { name: TARGET_TID,      bits: [7, 4],   access: rw, reset: 0x0, signal: r_target_tid, output: target_tid,
          description: "TID for the next CONTEXT_SWITCH." }
      - { name: TASK_COUNT,      bits: [11, 8],  access: ro, source: task_count }
      - { name: ALLOC_CONFLICT,  bits: [12, 12], access: ro, source: alloc_conflict }
      - { name: SWITCH_ACTIVE,   bits: [13, 13], access: ro, source: switch_active }
      - { name: SHUTDOWN_READY,  bits: [14, 14], access: ro, source: shutdown_ready_status }
      - { name: SHUTDOWN_ACK,    bits: [15, 15], access: wo,
          description: "Documented in the write-case comment but never decoded. Not implemented." }
      - { name: TID_ACTIVE_MASK, bits: [31, 16], access: ro, source: tid_active_mask,
          description: "Bitmask of running TIDs, one bit per TID, 16 TIDs max." }
    defects:
      - "BLOCKER: read concat totals 31 bits - the [15] pad for SHUTDOWN_ACK is missing. TID_ACTIVE_MASK therefore lands at [30:15], not [31:16]. Every TID in the mask reads one position low."
      - "SHUTDOWN_ACK is documented in the write comment but absent from the write decoder."

  - name: TID_STATUS
    offset: 0x94
    domain: os
    access: ro
    description: Per-TID context state. Selected by TASK_ALLOC_CTRL.ACTIVE_TID.
    fields:
      - { name: TID_STATE,        bits: [7, 0],   access: ro, source: tid_state,
          enum: { 0x00: EMPTY, 0x01: ALLOCATED, 0x02: READY, 0x03: RUNNING, 0x04: SUSPENDED,
                  0x05: BLOCKED, 0x06: SNAPSHOT, 0x07: FAULT, 0x08: COMPLETE, 0x09: SHUTDOWN, 0xFF: ERROR } }
      - { name: TID_PRIORITY,     bits: [11, 8],  access: ro, source: tid_priority }
      - { name: TID_PC,           bits: [23, 12], access: ro, source: tid_pc }
      - { name: TID_FAULT_COUNT,  bits: [27, 24], access: ro, source: tid_fault_count }
      - { name: TID_ANCHOR_VALID, bits: [28, 28], access: ro, source: tid_anchor_valid }
      - { name: RSVD,             bits: [31, 29], access: rsvd }

  - name: TILE_ALLOC_MAP
    offset: 0x98
    domain: os
    access: ro
    description: Ownership of the tile selected by TILE_SELECT.
    fields:
      - { name: TILE_SELECT_RB, bits: [8, 0],   access: ro, source: r_tile_select, description: "Readback of TILE_SELECT." }
      - { name: TILE_TID,       bits: [12, 9],  access: ro, source: tile_tid }
      - { name: TILE_ALLOCATED, bits: [13, 13], access: ro, source: tile_allocated }
      - { name: RSVD,           bits: [31, 14], access: rsvd }
    defects:
      - "BLOCKER: read concat totals 36 bits. The RTL comment claims TILE_ALLOCATED at [9] and TILE_TID at [8:5], overlapping the 9-bit TILE_SELECT. After 36->32 truncation the fields actually land at [13] and [12:9]. Spec records the actual placement; the comment is wrong and the pad must be fixed to 18'h0."

  - name: TILE_SELECT
    offset: 0x9C
    domain: os
    description: Tile index for the TILE_ALLOC_MAP query.
    fields:
      - { name: TILE_SELECT, bits: [8, 0],  access: rw, reset: 0x000, signal: r_tile_select, output: tile_select }
      - { name: RSVD,        bits: [31, 9], access: rsvd }

  - name: RATE_LIMIT_STATUS
    offset: 0xA0
    domain: os
    access: ro
    description: Bandwidth token bucket for ACTIVE_TID.
    fields:
      - { name: BW_TOKENS_REMAIN,  bits: [15, 0],  access: ro, source: bw_tokens_remain }
      - { name: BW_QUOTA_MBPS,     bits: [31, 16], access: ro, source: bw_quota_mbps_status }

  - name: SCHED_STATS
    offset: 0xA4
    domain: os
    access: ro
    description: Scheduler cycle fractions for TID0-3, one byte each.
    fields:
      - { name: SCHED_CYCLES, bits: [31, 0], access: ro, source: sched_cycles }

  - name: SHUTDOWN_CTRL
    offset: 0xA8
    domain: os
    description: Ordered shutdown sequencing.
    fields:
      - { name: SHUTDOWN_INIT,        bits: [0, 0],   access: rw, reset: 0, signal: r_shutdown_init,         output: shutdown_init }
      - { name: EMERGENCY_SHUTDOWN,   bits: [1, 1],   access: rw, reset: 0, signal: r_emergency_shutdown_sw, output: emergency_shutdown_sw }
      - { name: FLUSH_OMBS,           bits: [2, 2],   access: rw, reset: 1, signal: r_flush_ombs,            output: flush_ombs }
      - { name: IRQ_BEFORE_POWER,     bits: [3, 3],   access: rw, reset: 1, signal: r_irq_before_power,      output: irq_before_power }
      - { name: SHUTDOWN_TIMEOUT_MS,  bits: [15, 4],  access: rw, reset: 0xFA0, signal: r_shutdown_timeout_ms, output: shutdown_timeout_ms,
          description: "Reset default 0xFA0 = 4000 ms." }
      - { name: POWER_OFF_ASSERT,     bits: [16, 16], access: ro, source: power_off_assert }
      - { name: ALL_TIDS_SNAPSHOTTED, bits: [17, 17], access: ro, source: all_tids_snapshotted }
      - { name: OMB_FLUSH_DONE,       bits: [18, 18], access: ro, source: omb_flush_done }
      - { name: RSVD,                 bits: [31, 19], access: rsvd }

  # ===========================================================================
  # INFERENCE DOMAIN (continued)  0xAC
  # ===========================================================================
  # Appended here, not in the 0x00-0x14 inference block, which is full. Reports
  # the result of the pilot NORMALIZE block-floating-point pass that performs
  # the 32-bit-accumulator -> 12-bit-DAC compression
  # (carry_save_streaming_contract.md 5.1-5.4, 8.1). RTL support lands with the
  # 8.2 greencoyote_photonic_sequencer.sv rewrite; today the register reads 0.

  - name: BLK_SCALE_STATUS
    offset: 0xAC
    domain: inference
    access: ro
    description: >
      Block-floating-point scaling telemetry from the most recent reduction
      fire. Host-side reconstruction and debug of the 32-to-12 bit compression
      (carry_save_streaming_contract.md 5.1-5.4).
    fields:
      - { name: BLK_EXP,      bits: [4, 0],   access: ro, source: blk_exp_last,
          description: "Shared block exponent applied to the last reduction (5.1 step 2). Post-ADC results are scaled back by <<< BLK_EXP (5.4). Range 0-31." }
      - { name: CLAMP,        bits: [5, 5],   access: ro, source: blk_scale_clamp,
          description: "Sticky. Set when any lane's block-scaled code was clamped (5.1 step 3) or the shim saturated a finite accumulator value (7). Feeds the cal_err path. Clear semantics land with the 8.2 sequencer rewrite." }
      - { name: LANE_BIAS_N,  bits: [9, 6],   access: ro, source: lane_bias_n,
          description: "Active lane count (queue_depth) latched at the last fire. The post-ADC de-bias subtracts LANE_BIAS_N * 2048 (5.3), not 8 * 2048 -- absent lanes are not offset-biased." }
      - { name: RSVD,         bits: [31, 10], access: rsvd }

  # ===========================================================================
  # SS_READOUT DOMAIN  0xB0-0xC0
  # ===========================================================================
  # Single-slope (CMOS-image-sensor style) optical readout digital back-end.
  # Shared 12-bit Gray TDC at 6 GHz with 4-phase (24 GS/s) capture over 64
  # channels, feeding a per-channel 3-point (quadratic) calibration.
  # RTL: gcb-rtl/rtl/greencoyote_ss_tdc.sv, greencoyote_ss_calib.sv.
  # Analysis: gcb-papers/data/readout/spice/SPICE_RESULTS_V3.md,
  #           gcb-papers/data/readout/rtl/RTL_REPORT.md.

  - name: SS_TDC_CTRL
    offset: 0xB0
    domain: inference
    description: >
      Single-slope TDC run/gate control. The comparator power-gate window is
      placed STATICALLY around the calibration-known crossing (GATE_START), it
      is never triggered by a channel's comparator output.
    fields:
      - { name: CNT_EN,      bits: [0, 0],   access: rw, reset: 0, signal: r_ss_cnt_en, output: ss_cnt_en,
          description: "Run the shared Gray counter. Cleared = counter frozen, all phase latches hold." }
      - { name: CLEAR_ALL,   bits: [1, 1],   access: w1p, signal: r_ss_clear_all, output: ss_clear_all,
          description: "Self-clearing one-cycle strobe. Re-arms every channel's {fired} latch. Always reads 0." }
      - { name: RSVD_3_2,    bits: [3, 2],   access: rsvd }
      - { name: GATE_START,  bits: [15, 4],  access: rw, reset: 0x000, signal: r_ss_gate_start, output: ss_gate_start,
          description: "Coarse code (0-4095) at which the comparator power-gate opens. The gate spans GATE_WIDTH 6 GHz ticks centred on the calibration-known nominal crossing." }
      - { name: GATE_WIDTH,  bits: [27, 16], access: rw, reset: 0x078, signal: r_ss_gate_width, output: ss_gate_width,
          description: "Gate width in 6 GHz counter ticks. Reset 0x078 = 120 ticks = 20 ns at 6 GHz (the analysed gated-decision window)." }
      - { name: RSVD,        bits: [31, 28], access: rsvd }

  - name: SS_CAL_IDX
    offset: 0xB4
    domain: inference
    description: >
      Pointer into the per-channel calibration coefficient store. Auto-advances
      on every SS_CAL_DATA write: COEF_SEL 0->1->2 then wrap and CH += 1.
      A full re-cal of all 64 channels is 192 back-to-back SS_CAL_DATA writes.
    write_side_effect: "A direct write here sets the pointer and clears SS_TDC_STATUS.CAL_IDX_WRAP."
    fields:
      - { name: CH,          bits: [5, 0],   access: rw, reset: 0x00, signal: r_ss_cal_ch, output: ss_cal_ch,
          description: "Channel 0-63." }
      - { name: COEF_SEL,    bits: [7, 6],   access: rw, reset: 0b00, signal: r_ss_cal_sel, output: ss_cal_sel,
          enum: { 0: C0, 1: C1, 2: C2, 3: RSVD },
          description: "Which coefficient of x_hat = C2*u^2 + C1*u + C0 the next SS_CAL_DATA write targets. u = code/2^14." }
      - { name: RSVD,        bits: [31, 8],  access: rsvd }

  - name: SS_CAL_DATA
    offset: 0xB8
    domain: inference
    description: >
      Calibration coefficient value, signed Q4.28 fixed point (bit-exact
      contract in gcb-rtl/sim/golden_ss_readout.py). Writing commits the word
      to coefficient {SS_CAL_IDX.COEF_SEL} of channel {SS_CAL_IDX.CH} and
      auto-increments SS_CAL_IDX. The 3-point fit that produces these is a
      host/firmware float operation; the RTL only evaluates the polynomial.
    write_side_effect: "Commits ss_cal_wr to the coefficient store and advances SS_CAL_IDX (COEF_SEL, then CH). CAL_IDX_WRAP is set when CH rolls 63 -> 0."
    fields:
      - { name: SS_CAL_DATA, bits: [31, 0],  access: rw, reset: 0x00000000, signal: r_ss_cal_data, output: ss_cal_data,
          description: "Signed Q4.28. C1 (linear) is ~+1.0 nominal, C0/C2 are small." }

  - name: SS_RAMP_TIMING
    offset: 0xBC
    domain: inference
    description: Shared discharge-mode ramp generator timing.
    fields:
      - { name: T_RAMP,       bits: [11, 0],  access: rw, reset: 0xFFF, signal: r_ss_t_ramp, output: ss_t_ramp,
          description: "Ramp length in 6 GHz x 4-phase (24 GS/s) ticks. Reset 0xFFF = 4095 -> 12-bit coarse full-scale = 170.6 ns, inside the 256 ns observation window." }
      - { name: RAMP_RST_OFS, bits: [23, 12], access: rw, reset: 0x010, signal: r_ss_ramp_rst_ofs, output: ss_ramp_rst_ofs,
          description: "Delay (24 GS/s ticks) from integration end to ramp-reset release." }
      - { name: SLOPE_TRIM,   bits: [31, 24], access: rw, reset: 0x80, signal: r_ss_slope_trim, output: ss_slope_trim,
          description: "Signed offset (0x80 = 0) on the replica servo reference that sets the 4.2 mV/ns slope. Coarse PVT trim." }

  - name: SS_TDC_STATUS
    offset: 0xC0
    domain: inference
    access: ro
    description: Single-slope TDC telemetry.
    fields:
      - { name: RUNNING,      bits: [0, 0],   access: ro, source: ss_running,
          description: "Gray counter is advancing (CNT_EN and not overflowed-halted)." }
      - { name: OVERFLOW,     bits: [1, 1],   access: ro, source: ss_overflow,
          description: "Sticky. A channel was still un-fired when the ramp reached coarse full-scale." }
      - { name: RSVD_3_2,     bits: [3, 2],   access: rsvd }
      - { name: FIRED_COUNT,  bits: [9, 4],   access: ro, source: ss_fired_count,
          description: "Number of channels (0-64, saturating at 63 in this field) with a frozen result awaiting readout." }
      - { name: LAST_CH,      bits: [15, 10], access: ro, source: ss_last_ch,
          description: "Channel index of the most recent capture." }
      - { name: CAL_IDX_WRAP, bits: [16, 16], access: ro, source: ss_cal_idx_wrap,
          description: "Set when SS_CAL_IDX.CH rolled 63 -> 0 via auto-increment; cleared by a direct SS_CAL_IDX write." }
      - { name: RSVD,         bits: [31, 17], access: rsvd }

  # ===========================================================================
  # STREAMING TENSOR DMA DOMAIN  0xC4 - 0xE4
  # ===========================================================================
  # Inbound operand feed: a descriptor-ring / autonomous 2D tensor DMA that moves
  # activation and weight tiles from system memory / SRAM to the optical
  # modulator DACs, so the CPU issues zero instructions during an accumulation
  # window (Von Neumann starvation bypass). Architecture:
  # docs/streaming_dma_architecture.md (sec 6.4 defines this block). Complement of
  # carry_save_streaming_contract.md, which is the RESULT egress path.
  #
  # RTL is follow-on -- no *.sv is authored yet. map_version 0.6.0 lands the map
  # only; regen.py emits address / field / reset constants for the consumers.
  # The optical multiply/reduce core and single-slope readout are a fixed
  # black box downstream of the modulator DAC bus.

  - name: DMA_CTRL
    offset: 0xC4
    domain: dma
    description: >
      Streaming Tensor DMA run control and AXI4 read-master attributes. ARM is
      accepted only when >= WINDOW_W operand rows are resident in the ping-pong
      line buffers AND the weight-stationary buffer is loaded
      (docs/streaming_dma_architecture.md 4.1).
    fields:
      - { name: EN,        bits: [0, 0],   access: rw,  reset: 0, signal: r_dma_en, output: dma_en,
          description: "Master enable for the DMA engine. Cleared = descriptor walker and AXI read master idle." }
      - { name: ARM,       bits: [1, 1],   access: w1p, signal: r_dma_arm, output: dma_arm,
          description: "Self-clearing strobe. Arms the feed for the next accumulation window. Always reads 0." }
      - { name: ABORT,     bits: [2, 2],   access: w1p, signal: r_dma_abort, output: dma_abort,
          description: "Self-clearing strobe. Drops any in-flight window, flushes the line buffers, returns to idle. Always reads 0." }
      - { name: RING_SRC,  bits: [3, 3],   access: rw,  reset: 0, signal: r_dma_ring_src, output: dma_ring_src,
          enum: { 0: ONDIE, 1: INMEM },
          description: "0 = on-die descriptor ring written through DMA_DESC_WINDOW; 1 = in-memory ring at DMA_DESC_RING_BASE, fetched by the AXI read master (6.1)." }
      - { name: ARCACHE,   bits: [7, 4],   access: rw,  reset: 0x3, signal: r_dma_arcache, output: dma_arcache,
          description: "AXI4 ARCACHE for operand reads. Reset 0x3 = Normal Non-cacheable Bufferable." }
      - { name: ARPROT,    bits: [10, 8],  access: rw,  reset: 0b010, signal: r_dma_arprot, output: dma_arprot,
          description: "AXI4 ARPROT for operand reads. Reset 0b010 = unprivileged, non-secure, data." }
      - { name: RSVD_15_11, bits: [15, 11], access: rsvd }
      - { name: WINDOW_W,  bits: [27, 16], access: rw,  reset: 0x000, signal: r_dma_window_w, output: dma_window_w,
          description: "Operand rows the DMA must have buffered before ARM is accepted, i.e. the accumulation-window depth in tile rows (4.1). 0 = software has not configured a window." }
      - { name: RSVD,      bits: [31, 28], access: rsvd }

  - name: DMA_DESC_RING_BASE_LO
    offset: 0xC8
    domain: dma
    description: "Low 32 bits of the in-memory descriptor-ring base address (used when DMA_CTRL.RING_SRC = INMEM). 64-byte alignment recommended."
    fields:
      - { name: RING_BASE_LO, bits: [31, 0], access: rw, reset: 0x00000000, signal: r_dma_ring_base_lo, output: dma_ring_base_lo }

  - name: DMA_DESC_RING_BASE_HI
    offset: 0xCC
    domain: dma
    description: "High address bits and size of the in-memory descriptor ring."
    fields:
      - { name: RING_BASE_HI,  bits: [15, 0],  access: rw, reset: 0x0000, signal: r_dma_ring_base_hi, output: dma_ring_base_hi,
          description: "Bits [47:32] of the ring base address." }
      - { name: RING_SZ_LOG2,  bits: [20, 16], access: rw, reset: 0x5, signal: r_dma_ring_sz_log2, output: dma_ring_sz_log2,
          description: "log2 of the ring capacity in 32-byte descriptors. Reset 5 = 32 entries." }
      - { name: RSVD,          bits: [31, 21], access: rsvd }

  - name: DMA_DESC_HEAD
    offset: 0xD0
    domain: dma
    access: ro
    description: "Consumer index into the descriptor ring (next descriptor the walker will take). Wraps at 2^RING_SZ_LOG2."
    fields:
      - { name: HEAD, bits: [15, 0],  access: ro, source: dma_desc_head }
      - { name: RSVD, bits: [31, 16], access: rsvd }

  - name: DMA_DESC_TAIL
    offset: 0xD4
    domain: dma
    description: >
      Producer index into the descriptor ring. Software advances it after
      writing descriptors; a write here is the DOORBELL that tells the walker
      new descriptors are available.
    write_side_effect: "Rings the DMA doorbell (dma_desc_doorbell pulse)."
    fields:
      - { name: TAIL, bits: [15, 0],  access: rw, reset: 0x0000, signal: r_dma_desc_tail, output: dma_desc_tail }
      - { name: RSVD, bits: [31, 16], access: rsvd }

  - name: DMA_DESC_WINDOW
    offset: 0xD8
    domain: dma
    description: >
      Auto-increment write port for the on-die descriptor ring (used when
      DMA_CTRL.RING_SRC = ONDIE). Same pattern as BRAM_WR_DATA_HI / SS_CAL_DATA:
      each 32-bit write appends one word to the current descriptor; 8 writes
      (32 bytes) commit one descriptor and advance the ring tail. Write-only, no
      readback. Descriptor layout: docs/streaming_dma_architecture.md 2.2.
    write_side_effect: "Appends dma_desc_word to the on-die ring; every 8th write commits a descriptor and advances the tail."
    fields:
      - { name: DMA_DESC_WINDOW, bits: [31, 0], access: wo, signal: r_dma_desc_word, output: dma_desc_word }

  - name: DMA_WEIGHT_TILE_LO
    offset: 0xDC
    domain: dma
    description: "Low 32 bits of the weight-stationary tile base address (the tile loaded once and reused across the activation stream, 3.2)."
    fields:
      - { name: WT_BASE_LO, bits: [31, 0], access: rw, reset: 0x00000000, signal: r_dma_wt_base_lo, output: dma_wt_base_lo }

  - name: DMA_WEIGHT_TILE_HI
    offset: 0xE0
    domain: dma
    description: "High address bits and shape of the weight-stationary tile. Writing this latches the tile descriptor and starts the stationary load."
    write_side_effect: "Latches the weight-tile descriptor and starts the stationary load; poll DMA_STATUS.WT_LOADED."
    fields:
      - { name: WT_BASE_HI, bits: [15, 0],  access: rw, reset: 0x0000, signal: r_dma_wt_base_hi, output: dma_wt_base_hi,
          description: "Bits [47:32] of the weight-tile base address." }
      - { name: WT_SHAPE,   bits: [19, 16], access: rw, reset: 0x0, signal: r_dma_wt_shape, output: dma_wt_shape,
          description: "Weight-tile shape selector (tile-dimension code; encoding fixed with the optical array geometry)." }
      - { name: RSVD,       bits: [31, 20], access: rsvd }

  - name: DMA_STATUS
    offset: 0xE4
    domain: dma
    access: ro
    description: Streaming Tensor DMA telemetry.
    fields:
      - { name: RUNNING,       bits: [0, 0],   access: ro, source: dma_running,
          description: "Descriptor walker / AXI read master active." }
      - { name: ARMED,         bits: [1, 1],   access: ro, source: dma_armed,
          description: "Feed is armed: >= WINDOW_W rows buffered and the weight tile loaded. The sequencer issues FIRE only while this is set (4.1)." }
      - { name: WT_LOADED,     bits: [2, 2],   access: ro, source: dma_wt_loaded,
          description: "The weight-stationary buffer holds the tile named by DMA_WEIGHT_TILE_LO/HI." }
      - { name: UNDERRUN,      bits: [3, 3],   access: ro, source: dma_underrun,
          description: "Sticky. A line buffer would have underrun at a fire boundary; the window was aborted (feeds the cal_err path). Cleared by DMA_CTRL.ABORT." }
      - { name: DESC_ERR,      bits: [4, 4],   access: ro, source: dma_desc_err,
          description: "Sticky. A descriptor was malformed (bad stride, 4 KB-boundary violation the walker could not split, or a PRECISION mismatch vs PRECISION_MODE)." }
      - { name: RSVD_7_5,      bits: [7, 5],   access: rsvd }
      - { name: ROWS_BUFFERED, bits: [19, 8],  access: ro, source: dma_rows_buffered,
          description: "Operand rows currently resident in the ping-pong line buffers." }
      - { name: LAST_DESC_ID,  bits: [31, 20], access: ro, source: dma_last_desc_id,
          description: "Ring index of the most recently completed descriptor." }
